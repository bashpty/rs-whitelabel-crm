            },
            "borderRadius": {

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .bg-navy-overlay {
            background-color: rgba(10, 25, 47, 0.85);
        }

<body class="h-full bg-brand-navy antialiased selection:bg-brand-gold selection:text-brand-navy">
<!-- Background Image Container -->
<div class="fixed inset-0 z-0">
<div class="absolute inset-0 bg-cover bg-center w-full h-full" data-alt="A high-end, extremely luxurious commercial real estate interior, featuring vast open spaces, floor-to-ceiling windows overlooking a modern metropolis at dusk. The lighting is dramatic and architectural, with subtle warm tones contrasting against deep shadows. The overall aesthetic is strictly corporate, institutional, and highly prestigious, reflecting top-tier brokerage environments." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCCLBM8Yli-10HlcOxGuePHXrIVoXm9urm0j9Q7aN1K21s45BPFpOZgq1xTpJIoF1pQ4P10_modVTfRpaGiA_Pwh3jlbbrnjWH8XIT83oeuGdfy9ZWy3O7zuVaEBqNyIu6IygIu_sbwxXi8J-FH-jG8fpzfXoh5VAXmD26eUsJpIquUbooAh5AgkbXCxvxF-16iZpRj5zYUf3JaoqWpRBmmBz1-zsr0aJaxRTvjATM6zkPw-gpCXiio')"></div>
<div class="absolute inset-0 bg-navy-overlay"></div>
</div>
<!-- Main Content Layout -->
<div class="relative z-10 flex min-h-full flex-col justify-center py-12 sm:px-6 lg:px-8">
<div class="sm:mx-auto sm:w-full sm:max-w-md">
<!-- Brand Logo Area -->
<div class="text-center mb-8">
<h1 class="font-display-lg text-display-lg text-surface-white tracking-tight">LUX-SPATIAL</h1>
<p class="font-label-md text-label-md text-brand-gold uppercase tracking-widest mt-2">Enterprise CRM</p>
</div>
<!-- Login Card -->
<div class="bg-surface-white py-8 px-4 shadow-2xl sm:rounded-lg sm:px-10 border-t-4 border-brand-gold border-x border-b border-divider">
<div class="mb-8">
<h2 class="font-headline-md text-headline-md text-brand-navy text-center">Sign In to Brokerage HQ</h2>
</div>
<form action="#" class="space-y-6" method="POST">
<div>
<label class="block font-label-sm text-label-sm text-brand-slate uppercase mb-1" for="email">Email address</label>
<div class="mt-1">
<input autocomplete="email" class="appearance-none block w-full px-3 py-2 border border-brand-slate rounded shadow-sm placeholder-outline-variant font-body-md text-body-md text-primary focus:outline-none focus:ring-2 focus:ring-brand-gold focus:border-brand-navy sm:text-sm" id="email" name="email" required="" type="email"/>
</div>
</div>
<div>
<label class="block font-label-sm text-label-sm text-brand-slate uppercase mb-1" for="password">Password</label>
<div class="mt-1">
<input autocomplete="current-password" class="appearance-none block w-full px-3 py-2 border border-brand-slate rounded shadow-sm placeholder-outline-variant font-body-md text-body-md text-primary focus:outline-none focus:ring-2 focus:ring-brand-gold focus:border-brand-navy sm:text-sm" id="password" name="password" required="" type="password"/>
</div>
</div>
<div class="flex items-center justify-between">
<div class="flex items-center">
<input class="h-4 w-4 text-brand-navy focus:ring-brand-gold border-brand-slate rounded cursor-pointer" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block font-body-sm text-body-sm text-brand-slate cursor-pointer" for="remember-me">
                                Remember me
                            </label>
</div>
<div class="text-sm">
<a class="font-body-sm text-body-sm text-brand-navy hover:text-brand-gold transition-colors font-medium" href="#">
                                Forgot Password?
                            </a>
</div>
</div>
<div>
<button class="w-full flex justify-center py-2 px-4 border border-transparent rounded shadow-sm font-label-md text-label-md text-brand-navy bg-brand-gold hover:bg-tertiary-fixed-dim focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-gold transition-colors uppercase tracking-wider" type="submit">
                            Sign In
                        </button>
</div>
</form>
<div class="mt-6">
<div class="relative">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-divider"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-2 bg-surface-white text-brand-slate font-body-sm text-body-sm">
                                Or continue with
                            </span>
</div>
</div>
<div class="mt-6 grid grid-cols-2 gap-3">
<div>
<a class="w-full inline-flex justify-center py-2 px-4 border border-divider rounded bg-surface-white font-label-md text-label-md text-secondary hover:bg-surface-container-low transition-colors" href="#">
<span class="sr-only">Sign in with SSO</span>
                                SSO
                            </a>
</div>
<div>
<a class="w-full inline-flex justify-center py-2 px-4 border border-divider rounded bg-surface-white font-label-md text-label-md text-secondary hover:bg-surface-container-low transition-colors" href="#">
<span class="sr-only">Sign in with Security Key</span>
<span class="material-symbols-outlined text-xl">key</span>
</a>
</div>
</div>
</div>
</div>
<p class="mt-8 text-center font-body-sm text-body-sm text-surface-dim">
                Don't have an account? 
                <a class="font-medium text-brand-gold hover:text-surface-white transition-colors" href="#">
                    Contact Administrator
                </a>
</p>
</div>
</div>
<script>
        // Optional subtle entry animation for the card
        document.addEventListener('DOMContentLoaded', () => {
            const card = document.querySelector('.bg-surface-white');
            card.style.opacity = '0';
            card.style.transform = 'translateY(20px)';
            card.style.transition = 'opacity 0.6s ease-out, transform 0.6s ease-out';
            
            setTimeout(() => {
                card.style.opacity = '1';
                card.style.transform = 'translateY(0)';
            }, 100);
        });
    </script>
</body></html>
