<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid theme('colors.divider');
        }
        
        .gold-accent-top {
            border-top: 4px solid #D4AF37;
        }

        .lux-input {
            border: 1px solid theme('colors.outline-variant');
            transition: all 0.2s ease-in-out;
        }

        .lux-input:focus {
            border-color: theme('colors.primary-container');
            box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.3); /* Gold outer glow */
            outline: none;
        }
        
        body {
            /* Deep Navy Background as requested */
            background-color: theme('colors.primary-container'); 
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(212, 175, 55, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(255, 255, 255, 0.03) 0%, transparent 50%);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-grid-margin relative overflow-hidden">
<!-- Ambient Background Elements -->
<div class="absolute inset-0 pointer-events-none opacity-20" style="background-image: url('data:image/svg+xml,%3Csvg width=\'60\' height=\'60\' viewBox=\'0 0 60 60\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cg fill=\'none\' fill-rule=\'evenodd\'%3E%3Cg fill=\'%23ffffff\' fill-opacity=\'0.2\'%3E%3Cpath d=\'M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z\'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E');"></div>
<!-- Main Registration Card -->
<main class="w-full max-w-md relative z-10">
<!-- Logo Header -->
<div class="text-center mb-8">
<h1 class="font-headline-lg text-headline-lg text-surface-white tracking-tight mb-2">LUX-SPATIAL</h1>
<p class="font-label-md text-label-md text-inverse-primary uppercase tracking-widest">Enterprise CRM</p>
</div>
<div class="glass-panel gold-accent-top rounded-lg shadow-2xl p-8">
<div class="mb-6">
<h2 class="font-headline-md text-headline-md text-on-surface mb-1">Institutional Registration</h2>
<p class="font-body-sm text-body-sm text-secondary">Establish your organization's spatial workspace.</p>
</div>
<form class="space-y-stack-default">
<!-- Full Name -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-1" for="fullName">Full Name</label>
<input class="lux-input w-full rounded bg-surface-white font-body-md text-body-md text-on-surface px-4 py-2" id="fullName" placeholder="Jane Doe" required="" type="text"/>
</div>
<!-- Organization Name -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-1" for="orgName">Company / Organization Name</label>
<input class="lux-input w-full rounded bg-surface-white font-body-md text-body-md text-on-surface px-4 py-2" id="orgName" placeholder="Acme Holdings LLC" required="" type="text"/>
</div>
<!-- Business Email -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-1" for="email">Business Email</label>
<input class="lux-input w-full rounded bg-surface-white font-body-md text-body-md text-on-surface px-4 py-2" id="email" placeholder="jane@acmeholdings.com" required="" type="email"/>
</div>
<!-- Tenant Slug -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-1" for="slug">Workspace URL (Slug)</label>
<div class="flex items-center lux-input rounded bg-surface-white overflow-hidden">
<span class="px-3 py-2 bg-surface-container font-label-md text-label-md text-secondary border-r border-outline-variant">lux-spatial.com/</span>
<input class="w-full bg-transparent font-body-md text-body-md text-on-surface px-3 py-2 outline-none border-none focus:ring-0" id="slug" placeholder="acme" required="" type="text"/>
</div>
</div>
<!-- Password -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-1" for="password">Password</label>
<input class="lux-input w-full rounded bg-surface-white font-body-md text-body-md text-on-surface px-4 py-2" id="password" placeholder="••••••••" required="" type="password"/>
</div>
<!-- Submit CTA -->
<button class="w-full mt-6 bg-[#D4AF37] hover:bg-[#c4a132] text-primary-container font-label-md text-label-md py-3 px-4 rounded transition-colors shadow-sm font-semibold flex items-center justify-center gap-2" type="submit">
                    Create Institutional Account
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<div class="mt-6 text-center">
<p class="font-body-sm text-body-sm text-secondary">
                    Already an established tenant? 
                    <a class="text-tertiary-container hover:text-tertiary underline font-medium" href="#">Sign In</a>
</p>
</div>
</div>
</main>
<!-- Footer - Transactional Context, Minimal shell -->
<footer class="absolute bottom-0 w-full py-4 px-grid-margin flex justify-center items-center opacity-80 z-10">
<div class="flex gap-6 font-label-sm text-label-sm text-inverse-primary">
<a class="hover:text-surface-white transition-colors cursor-pointer" href="#">Privacy Policy</a>
<span class="text-secondary-fixed-dim">•</span>
<a class="hover:text-surface-white transition-colors cursor-pointer" href="#">Terms of Service</a>
</div>
</footer>
</body></html>
