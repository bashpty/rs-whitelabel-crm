<body class="h-full bg-primary-container text-on-primary-container font-body-md text-body-md flex flex-col justify-center items-center px-grid-margin relative overflow-hidden">
<!-- Abstract ambient background effect to add a touch of institutional luxury depth without distracting from the form -->
<div class="absolute inset-0 z-0 pointer-events-none opacity-20 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-secondary-fixed to-transparent"></div>
<div class="absolute inset-0 z-0 pointer-events-none opacity-10 bg-[radial-gradient(circle_at_bottom_left,_var(--tw-gradient-stops))] from-tertiary-fixed to-transparent"></div>
<div class="w-full max-w-md bg-surface-white rounded-lg shadow-2xl z-10 border border-divider overflow-hidden flex flex-col relative">
<!-- Accent Line -->
<div class="h-1 w-full bg-tertiary-container absolute top-0 left-0"></div>
<div class="p-8 sm:p-10 flex flex-col gap-6">
<!-- Header Section -->
<div class="text-center flex flex-col items-center">
<span class="material-symbols-outlined text-4xl text-primary mb-4" data-icon="lock_reset" data-weight="fill" style="font-variation-settings: 'FILL' 1;">lock_reset</span>
<h1 class="font-headline-md text-headline-md text-primary tracking-tight">Reset Password</h1>
<p class="font-body-sm text-body-sm text-secondary mt-2">Enter your institutional email to receive reset instructions.</p>
</div>
<!-- Form Section -->
<form class="flex flex-col gap-stack-default mt-4" onsubmit="event.preventDefault(); alert('Reset link sent to institutional email.');">
<div class="flex flex-col gap-stack-compact">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" for="email">Institutional Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline" data-icon="mail">mail</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface font-body-md text-body-md rounded-DEFAULT py-3 pl-10 pr-3 focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-shadow shadow-sm" id="email" name="email" placeholder="executive@firm.com" required="" type="email"/>
</div>
</div>
<button class="w-full bg-tertiary-container hover:bg-tertiary-fixed-dim text-on-tertiary-container font-label-md text-label-md py-3 px-4 rounded-DEFAULT transition-colors mt-2 shadow-sm uppercase tracking-wider font-semibold" type="submit">
                    Send Reset Link
                </button>
</form>
<!-- Secondary Actions -->
<div class="mt-4 pt-6 border-t border-divider text-center">
<a class="inline-flex items-center gap-2 font-label-md text-label-md text-secondary hover:text-primary transition-colors group" href="#">
<span class="material-symbols-outlined text-lg group-hover:-translate-x-1 transition-transform" data-icon="arrow_back">arrow_back</span>
                    Return to Sign In
                </a>
</div>
</div>
</div>
<!-- Footer Branding -->
<div class="mt-12 text-center z-10 flex flex-col items-center gap-2">
